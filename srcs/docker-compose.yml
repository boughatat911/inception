version: "3.3"

services:

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    ports:
      - "3306:3306"
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    secrets:
      - db_root_password
      - mysql_password

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    ports:
      - "9000:9000"
    env_file: .env
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    secrets:
      - wp_admin_password
      - wp_user_password
      - mysql_password

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    depends_on:
      - wordpress
    env_file: .env
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception

networks:
  inception:

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nbougrin/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nbougrin/data/wordpress
secrets:
  db_root_password:
    file: ../secrets/db_root_password
  mysql_password:
    file: ../secrets/mysql_password
  wp_admin_password:
    file: ../secrets/wp_admin_password
  wp_user_password:
    file: ../secrets/wp_user_password