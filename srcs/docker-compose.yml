version: "3.3"

services:

  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
      - ../secrets/db_root_password:/run/secrets/db_root_password:ro
      - ../secrets/mysql_password:/run/secrets/mysql_password:ro
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    ports:
      - "9000:9000"
    env_file: .env
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/html
      - ../secrets/wp_admin_password:/run/secrets/wp_admin_password:ro
      - ../secrets/wp_user_password:/run/secrets/wp_user_password:ro
      - ../secrets/mysql_password:/run/secrets/mysql_password:ro
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    depends_on:
      - wordpress
    env_file: .env
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception

networks:
  inception:

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nbougrin/data/db
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nbougrin/data/wp
